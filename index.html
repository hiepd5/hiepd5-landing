<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Vương Đắc Hiệp — HiepD5.com">
  <title>HiepD5.com — Vương Đắc Hiệp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading -->
  <div id="loading">
    <div class="loading-brand">HIEPD5.COM</div>
    <div class="loading-progress-bar"><div class="loading-progress-fill"></div></div>
    <span>CINEMATIC ARCHITECTURE</span>
  </div>

  <!-- Custom cursor -->
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <!-- Scene layers — built by JS -->
  <div id="scenes"></div>

  <!-- Left info panel -->
  <div id="info-panel">
    <div id="project-label">PROJECT BY / VƯƠNG ĐẮC HIỆP</div>
    <h1 id="scene-title"></h1>
    <div id="scene-subtitle"></div>
    <div id="scene-divider"></div>
    <ul id="scene-specs"></ul>
    <!-- Dynamic action buttons (like Youtube playlists) -->
    <div id="scene-actions"></div>
  </div>

  <!-- Ambient Audio -->
  <audio id="bg-audio" loop>
    <source src="https://pub-51ede49b8dd446e48127b94ee7d22d71.r2.dev/audio/tour360-ambient.mp3" type="audio/mpeg">
  </audio>

  <!-- Top navigation -->
  <nav id="top-nav">
    <div id="nav-owner">HiepD5.com</div>
    <div id="nav-links"></div>
    <div id="nav-contact">
      <a href="tel:0979591156">0979 591 156</a>
    </div>
    
    <!-- Soundwave Audio Toggle -->
    <button id="audio-toggle" class="audio-muted" title="Bật/Tắt Nhạc Nền">
      <span class="bar bar-1"></span>
      <span class="bar bar-2"></span>
      <span class="bar bar-3"></span>
      <span class="bar bar-4"></span>
    </button>

    <a id="nav-ai-btn" href="https://aistudio.google.com/u/1/apps/acd43aee-4604-4684-a130-194bea8817fa?showPreview=true&amp;showAssistant=true&amp;fullscreenApplet=true" target="_blank" rel="noopener">AI PROMPT 2.0</a>

    <a id="nav-masoi-btn" href="https://masoi-client.vercel.app" target="_blank" rel="noopener">🐺 MA SÓI</a>

    <!-- Hamburger Menu Toggle (Mobile) -->
    <button id="menu-toggle" aria-label="Menu Toggle">
      <span class="line line-1"></span>
      <span class="line line-2"></span>
    </button>
  </nav>

  <!-- Right indicators -->
  <div id="right-panel">
    <div id="scene-code"></div>
    <div id="crosshair">+</div>
    <div id="coordinates">21.028°N / 105.834°E</div>
  </div>

  <!-- Bottom bar -->
  <div id="bottom-bar">
    <div id="progress"></div>
    <div id="scroll-hint">
      <span>Scroll</span>
      <div class="wheel"><div class="wheel-dot"></div></div>
    </div>
    <div id="scene-cta"></div>
  </div>

  <!-- Mobile Menu Overlay -->
  <div id="mobile-menu-overlay">
    <div class="mobile-menu-links"></div>
    <div class="mobile-menu-footer">
      <a href="tel:0979591156">Zalo: 0979 591 156</a>
      <span>kts.vuongdachiep@gmail.com</span>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
