<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Vương Đắc Hiệp — HiepD5.com">
  <title>HiepD5.com — Vương Đắc Hiệp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading -->
  <div id="loading">
    <div class="loading-dot"></div>
    <span>Loading</span>
  </div>

  <!-- Custom cursor -->
  <div id="cursor"></div>

  <!-- Scene layers — built by JS -->
  <div id="scenes"></div>

  <!-- Left info panel -->
  <div id="info-panel">
    <div id="project-label">PROJECT BY / VƯƠNG ĐẮC HIỆP</div>
    <h1 id="scene-title"></h1>
    <div id="scene-subtitle"></div>
    <div id="scene-divider"></div>
    <ul id="scene-specs"></ul>
  </div>

  <!-- Top navigation -->
  <nav id="top-nav">
    <div id="nav-owner">HiepD5.com</div>
    <div id="nav-links"></div>
    <div id="nav-contact">
      <a href="tel:0979591156">0979 591 156</a>
    </div>
    <a id="nav-ai-btn" href="https://aistudio.google.com/u/1/apps/acd43aee-4604-4684-a130-194bea8817fa?showPreview=true&amp;showAssistant=true&amp;fullscreenApplet=true" target="_blank" rel="noopener">AI PROMPT 2.0</a>
  </nav>

  <!-- Right indicators -->
  <div id="right-panel">
    <div id="scene-code"></div>
    <div id="crosshair">+</div>
    <div id="coordinates">21.028°N / 105.834°E</div>
  </div>

  <!-- Bottom bar -->
  <div id="bottom-bar">
    <div id="progress"></div>
    <div id="scroll-hint">
      <span>Scroll</span>
      <div class="wheel"><div class="wheel-dot"></div></div>
    </div>
    <div id="scene-cta"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
